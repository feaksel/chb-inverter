name: dashboard-tests

on:
  push:
    branches: [main]
    paths:
      - "firmware/stm32-f303re/dashboard/**"
      - ".github/workflows/dashboard-tests.yml"
  pull_request:
    paths:
      - "firmware/stm32-f303re/dashboard/**"
      - ".github/workflows/dashboard-tests.yml"
  workflow_dispatch:

jobs:
  test:
    name: Run dashboard unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        # PySide6==6.5.3 (pinned in dashboard/requirements.txt) ships wheels
        # for 3.7-3.11 only — no 3.12 build yet. The unit tests don't actually
        # need Qt, but other dev tooling does, so use the supported runtime.
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Detect dashboard tests
        id: detect
        run: |
          if [ -d firmware/stm32-f303re/dashboard/tests ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::firmware/stm32-f303re/dashboard/tests/ not present — skipping."
          fi

      - name: Install minimum runtime for tests
        # The parser and sim tests are pure Python — they intentionally do not
        # import PySide6, pyserial, or pyqtgraph. numpy is the only third-party
        # dep the sim controller pulls in.
        if: steps.detect.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.0"

      - name: Run unittest discover
        if: steps.detect.outputs.present == 'true'
        working-directory: firmware/stm32-f303re/dashboard
        run: python -m unittest discover tests -v
