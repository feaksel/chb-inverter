name: dashboard-tests

on:
  push:
    branches: [main]
    paths:
      - "firmware/stm32-f303re/dashboard/**"
      - ".github/workflows/dashboard-tests.yml"
  pull_request:
    paths:
      - "firmware/stm32-f303re/dashboard/**"
      - ".github/workflows/dashboard-tests.yml"
  workflow_dispatch:

jobs:
  test:
    name: Run dashboard unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Detect dashboard tree
        id: detect
        run: |
          if [ -d firmware/stm32-f303re/dashboard ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::firmware/stm32-f303re/dashboard/ not yet imported — skipping tests."
          fi

      - name: Install dashboard dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: firmware/stm32-f303re/dashboard
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            pip install -e .
          else
            echo "::notice::No requirements.txt or pyproject.toml — installing PySide6 only."
            pip install PySide6 pyserial
          fi

      - name: Run unittest discover
        if: steps.detect.outputs.present == 'true'
        working-directory: firmware/stm32-f303re/dashboard
        run: |
          if [ -d tests ]; then
            python -m unittest discover tests -v
          else
            echo "::notice::No tests/ directory found — skipping."
          fi
