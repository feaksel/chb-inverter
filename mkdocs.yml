site_name: 5-Level CHB Inverter
site_url: https://feaksel.github.io/chb-inverter/
site_description: >-
  Engineering documentation for the 5-Level Cascaded H-Bridge Inverter built as the
  ELE 401/402 graduation project at Hacettepe University EEE.
site_author: Cereyan Hacıları — Furkan Emir Aksel, Ahmet Koçak, Faruk Gökhan Abay, Mücahit Aydın
copyright: Copyright &copy; 2026 Cereyan Hacıları — Hacettepe University EEE

repo_url: https://github.com/feaksel/chb-inverter
repo_name: feaksel/chb-inverter
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# `include-markdown` rewrites links from imported files (FIRST_BENCH_SESSION.md,
# HARDWARE_BRINGUP.md, etc.) into paths under firmware/stm32-f303re/* — outside
# the docs tree. MkDocs can't validate those, so demote not_found to `info`. The
# stricter post-build `tools/docs-link-check.py` still catches in-tree breakage.
validation:
  links:
    not_found: info
    anchors: info  # included content (build guide, bring-up) has manual TOC anchors that don't always match MkDocs' slugify
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

plugins:
  - search
  - awesome-pages
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true
      enable_git_follow: false
  - include-markdown
  - mermaid2:
      version: 10.9.0
      javascript: https://unpkg.com/mermaid@10.9.0/dist/mermaid.min.js
  - table-reader

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/feaksel/chb-inverter
      name: chb-inverter on GitHub
  generator: false
  status:
    new: Recently added
    deprecated: Superseded

extra_css:
  - stylesheets/extra.css

watch:
  - docs/
